{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Smart Agriculture</span>
    <div><a href="/UserHome">Home</a><a href="/Viewcart">Cart</a><a href="/logout">Logout</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container">
    <h2>Shop by Category</h2>
    <table>
        <thead>
            <tr><th>#</th><th>Category</th><th>Price (₹/unit)</th><th>Action</th></tr>
        </thead>
        <tbody>
        {% for row in data %}
            <tr>
                <td>{{ row.0 }}</td><td>{{ row.1 }}</td><td>{{ row.2 }}</td>
                <td><a href="/selctproducts/{{ row.0 }}/{{ row.2 }}" class="btn btn-green">View Products</a></td>
            </tr>
        {% empty %}
            <tr><td colspan="4" style="text-align:center;color:#888;">No categories available.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
