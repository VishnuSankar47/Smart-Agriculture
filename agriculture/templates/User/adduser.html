{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Smart Agriculture</span>
    <div><a href="/">Home</a><a href="/login">Login</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card" style="max-width:560px;">
        <h2>Customer Registration</h2>
        <form action="/adduser" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="user_id" placeholder="Choose a unique ID" required>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="TxtEmail" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="TxtPhone" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="TxtAddress" rows="2" required></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group"><label>City</label><input type="text" name="city" required></div>
                <div class="form-group"><label>Pincode</label><input type="text" name="pincode" required></div>
                <div class="form-group"><label>State</label><input type="text" name="state" required></div>
                <div class="form-group"><label>Country</label><input type="text" name="country" required></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>
</div>
{% endblock %}
