{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Smart Agriculture</span>
    <div><a href="/UserHome">Home</a><a href="/logout">Logout</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card">
        <h2>💳 Payment</h2>
        <p style="color:#888;font-size:13px;margin-bottom:20px;">
            ⚠️ This is a demo payment form. Do not enter real card details.
        </p>
        <form action="/Bank" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Card Number</label>
                <input type="text" name="card_no" placeholder="16-digit card number" maxlength="20" required>
            </div>
            <div class="form-group">
                <label>Card Holder Name</label>
                <input type="text" name="card_holder_name" required>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" name="cvv_no" maxlength="4" placeholder="123" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" name="expiry_date" required>
                </div>
            </div>
            <button type="submit" class="submit-btn">Pay Now</button>
        </form>
    </div>
</div>
{% endblock %}
