{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Smart Agriculture</span>
    <div><a href="/UserHome">Home</a><a href="/logout">Logout</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card">
        <h2>Submit a Complaint</h2>
        <form action="/Sendcompliant" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Details</label>
                <textarea name="details" rows="5" placeholder="Describe your issue..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
