{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Farmer Portal</span>
    <div><a href="/FarmerHome">Dashboard</a><a href="/logout">Logout</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card">
        <h2>Add Product</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Quantity (units)</label>
                <input type="number" name="quantity" min="1" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="item_description" rows="4" placeholder="Describe your produce..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit for Approval</button>
        </form>
    </div>
</div>
{% endblock %}
