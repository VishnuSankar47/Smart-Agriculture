{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Smart Agriculture</span>
    <div><a href="/">Home</a><a href="/login">Login</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card" style="max-width:560px;">
        <h2>Farmer Registration</h2>
        <form action="/register_farmer" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Farmer ID</label>
                <input type="text" name="farmer_id" placeholder="Choose a unique ID" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="TxtAddress" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="TxtPhone" required>
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" required>
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" name="pincode" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Submit Registration</button>
        </form>
    </div>
</div>
{% endblock %}
