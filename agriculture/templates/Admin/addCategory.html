{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Admin Panel</span>
    <div><a href="/AdminHomePage">Dashboard</a><a href="/logout">Logout</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card">
        <h2>Add Category</h2>
        <form action="/addCategory" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" name="txtname" placeholder="e.g. Tomatoes" required>
            </div>
            <div class="form-group">
                <label>Selling Price (₹ per unit)</label>
                <input type="number" name="price" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Farmer Price (₹ per unit)</label>
                <input type="number" name="farmer_price" step="0.01" required>
            </div>
            <button type="submit" class="submit-btn">Add Category</button>
        </form>
    </div>
</div>
{% endblock %}
