{% extends 'base.html' %}
{% block nav %}
<nav>
    <span style="font-size:18px;font-weight:700;">🌾 Admin Panel</span>
    <div><a href="/AdminHomePage">Dashboard</a><a href="/logout">Logout</a></div>
</nav>
{% endblock %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="form-card">
        <h2>Reply to Complaint</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Your Reply</label>
                <textarea name="TxtReply" rows="5" placeholder="Type your reply here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Reply</button>
        </form>
    </div>
</div>
{% endblock %}
